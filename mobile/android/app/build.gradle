plugins { id 'com.android.application' }

def signingDir = new File(System.getenv('QIREADER_SIGNING_DIR') ?: "${System.getProperty('user.home')}/.local/share/qireader-filter/signing")
def signingPassword = new File(signingDir, 'password')

android {
    namespace 'com.qireader.filter'
    compileSdk 36
    defaultConfig {
        applicationId 'com.qireader.filter'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '0.1.2'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        release {
            if (signingPassword.exists()) {
                storeFile new File(signingDir, 'release.jks')
                storePassword signingPassword.text.trim()
                keyAlias 'qireader-filter'
                keyPassword signingPassword.text.trim()
            }
        }
    }
    buildTypes { release { signingConfig signingConfigs.release } }
}
dependencies {
    implementation 'androidx.webkit:webkit:1.14.0'
    implementation 'androidx.core:core:1.15.0'
    testImplementation 'junit:junit:4.13.2'
}
